name: Windows declaration parser preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-parser:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        revision:
          - 7677ef0fb0284bb317cfec78b436545f87f3997a
          - 0d9551cae1289ed8aaf646a879412dc1d4f8ac8c
        variant: [default, encrypted, namedpipe386, sharedmemory]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Verify exact tested revision and Windows environment
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ matrix.revision }}
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw 'Tested SHA mismatch' }
          git rev-parse HEAD
          go version
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version
          Get-Service | Where-Object Name -Match 'SQL|MSSQL' | Format-Table -AutoSize
          $key = 'HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\Instance Names\SQL'
          if (Test-Path $key) { Get-ItemProperty $key | Format-List }
          Get-ChildItem 'C:\Program Files\Microsoft SQL Server' -Filter SqlLocalDB.exe -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
      - name: Execute Windows declaration regression tests
        shell: pwsh
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          $testArgs = @('test', '-json', '-count=1', '-run', '^TestMakeDecl', '.')
          if ($env:VARIANT -eq 'namedpipe386') { $env:GOARCH='386'; $testArgs += @('-tags', 'np') }
          if ($env:VARIANT -eq 'sharedmemory') { $testArgs += @('-tags', 'sm') }
          if ($env:VARIANT -eq 'encrypted') { $env:COLUMNENCRYPTION='1' }
          go env GOOS GOARCH
          & go @testArgs | Tee-Object -FilePath parser-results.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $events = Get-Content parser-results.jsonl | ForEach-Object { $_ | ConvertFrom-Json }
          $passed = @($events | Where-Object { $_.Action -eq 'pass' -and $_.Test -match '^TestMakeDecl' })
          if ($passed.Count -lt 3) { throw 'Required declaration regression tests did not execute' }
          Write-Host "Executed $($passed.Count) declaration tests and subtests. SQL service integration was not exercised by this parser-only preflight."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-parser-${{ matrix.revision }}-${{ matrix.variant }}
          path: parser-results.jsonl
