name: SQL declaration lint preflight
on:
  push:
    branches: [codex/preflight-453-lint]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0d9551cae1289ed8aaf646a879412dc1d4f8ac8c
          fetch-depth: 0
      - name: Prepare exact review comparison
        run: |
          printf '%s\n' '#!/bin/sh' 'git diff fa8008dc66468d611c36f75f2972de7ad77f775f HEAD' > /tmp/sql-review-diff
          chmod +x /tmp/sql-review-diff
      - uses: reviewdog/action-golangci-lint@c76cceaaab89abe74e649d2e34c6c9adc26662d2
        with:
          level: warning
          reporter: local
          reviewdog_flags: -diff=/tmp/sql-review-diff
